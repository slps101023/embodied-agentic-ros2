# ============================================================
# JetRover Nav2 Parameters
# Robot: JetRover Mecanum
# Simulation: Gazebo
# LiDAR: /scan
# TF:
#   map -> odom -> base_link -> lidar_frame
# ============================================================


# ============================================================
# AMCL
# ============================================================

amcl:
  ros__parameters:

    use_sim_time: true

    # Frames
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Laser
    scan_topic: /scan
    laser_model_type: "likelihood_field"

    # Particle filter
    min_particles: 500
    max_particles: 2000

    # Motion model
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Update thresholds
    update_min_d: 0.2
    update_min_a: 0.2

    # Laser parameters
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 60

    # Transform tolerance
    transform_tolerance: 1.0

    # Initial pose
    set_initial_pose: false

    # Resampling
    resample_interval: 1

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0


# ============================================================
# MAP SERVER
# ============================================================

map_server:
  ros__parameters:

    use_sim_time: true

    yaml_filename: ""


# ============================================================
# PLANNER SERVER
# ============================================================

planner_server:
  ros__parameters:

    use_sim_time: true

    expected_planner_frequency: 20.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.5
      use_astar: false
      allow_unknown: true


# ============================================================
# CONTROLLER SERVER
# ============================================================

controller_server:
  ros__parameters:

    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - "progress_checker"

    goal_checker_plugins:
      - "goal_checker"

    controller_plugins:
      - "FollowPath"


    # --------------------------------------------------------
    # Progress Checker
    # --------------------------------------------------------

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.5
      movement_time_allowance: 10.0


    # --------------------------------------------------------
    # Goal Checker
    # --------------------------------------------------------

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

      stateful: true


    # --------------------------------------------------------
    # DWB Controller
    # --------------------------------------------------------

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      # Velocity limits
      min_vel_x: -0.5
      max_vel_x: 0.5

      min_vel_y: -0.5
      max_vel_y: 0.5

      min_speed_xy: 0.0
      max_speed_xy: 0.7

      min_speed_theta: 0.0
      max_vel_theta: 1.0

      # Acceleration limits
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.5

      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5

      # Sampling
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 20

      sim_time: 1.5

      # Trajectory scoring
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1

      short_circuit_trajectory_evaluation: true

      stateful: true

      # Critics
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


# ============================================================
# LOCAL COSTMAP
# ============================================================

local_costmap:
  local_costmap:

    ros__parameters:

      use_sim_time: true

      # Frames
      global_frame: odom
      robot_base_frame: base_link

      # Update rate
      update_frequency: 10.0
      publish_frequency: 5.0

      # Rolling window
      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      # Robot footprint
      robot_radius: 0.25

      # Plugins
      plugins:
        - "obstacle_layer"
        - "inflation_layer"


      # ------------------------------------------------------
      # Obstacle Layer
      # ------------------------------------------------------

      obstacle_layer:

        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 10.0
          obstacle_min_range: 0.15

          raytrace_max_range: 12.0
          raytrace_min_range: 0.15


      # ------------------------------------------------------
      # Inflation Layer
      # ------------------------------------------------------

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.55


# ============================================================
# GLOBAL COSTMAP
# ============================================================

global_costmap:
  global_costmap:

    ros__parameters:

      use_sim_time: true

      # Frames
      global_frame: map
      robot_base_frame: base_link

      # Update rate
      update_frequency: 5.0
      publish_frequency: 2.0

      # Map
      resolution: 0.05

      track_unknown_space: true

      # Robot footprint
      robot_radius: 0.25

      # Plugins
      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"


      # ------------------------------------------------------
      # Static Map
      # ------------------------------------------------------

      static_layer:

        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true


      # ------------------------------------------------------
      # Dynamic Obstacles
      # ------------------------------------------------------

      obstacle_layer:

        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 10.0
          obstacle_min_range: 0.15

          raytrace_max_range: 12.0
          raytrace_min_range: 0.15


      # ------------------------------------------------------
      # Inflation
      # ------------------------------------------------------

      inflation_layer:

        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.55


# ============================================================
# BT NAVIGATOR
# ============================================================

bt_navigator:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link

    odom_topic: /odom

    bt_loop_duration: 10

    default_server_timeout: 20

    enable_groot_monitoring: false

    navigators:
      - "navigate_to_pose"
      - "navigate_through_poses"

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"


# ============================================================
# BEHAVIOR SERVER
# ============================================================

behavior_server:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link

    cycle_frequency: 10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "drive_on_heading"
      - "wait"

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    local_frame: odom

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0


# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

waypoint_follower:
  ros__parameters:

    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: false

      waypoint_pause_duration: 0


# ============================================================
# VELOCITY SMOOTHER
# ============================================================

velocity_smoother:
  ros__parameters:

    use_sim_time: true

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: "OPEN_LOOP"

    # x
    max_velocity:
      - 0.5
      - 0.5
      - 1.0

    min_velocity:
      - -0.5
      - -0.5
      - -1.0

    # acceleration
    max_accel:
      - 1.0
      - 1.0
      - 1.5

    max_decel:
      - -1.0
      - -1.0
      - -1.5

    velocity_timeout: 1.0

    odom_topic: /odom

    odom_duration: 0.1


# ============================================================
# LIFECYCLE MANAGER - LOCALIZATION
# ============================================================

lifecycle_manager_localization:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - "map_server"
      - "amcl"


# ============================================================
# LIFECYCLE MANAGER - NAVIGATION
# ============================================================

lifecycle_manager_navigation:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - "controller_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
      - "waypoint_follower"
      - "velocity_smoother"

collision_monitor:
  ros__parameters:

    use_sim_time: true

    enabled: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    base_shift_correction: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: false

    polygons: ["PolygonStop"]

    PolygonStop:
      type: "polygon"
      action_type: "stop"

      points: "[[0.5, 0.4], [0.5, -0.4], [-0.5, -0.4], [-0.5, 0.4]]"

docking_server:
  ros__parameters:

    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0

    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1

    max_retries: 3

    base_frame: "base_link"
    fixed_frame: "odom"

    dock_prestaging_tolerance: 0.5

    dock_plugins: ["simple_charging_dock"]

    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"

      docking_threshold: 0.05
      staging_x_offset: -0.7

      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      dock_direction: "forward"

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0

      filter_coef: 0.1
