controller_manager:
  ros__parameters:
    update_rate: 50 # Hz

    # 1. 廣播關節狀態的 Controller
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 2. 控制機械手臂 1~5 號關節的 Controller
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 3. 控制夾爪的 Controller
    gripper_controller:
      type: position_controllers/JointGroupPositionController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - r_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity